<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Ridge Run — a flight game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0b1526;
    overflow: hidden;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
  #help {
    position: fixed;
    left: 10px;
    bottom: 8px;
    color: rgba(220, 235, 255, 0.55);
    font: 12px/1.4 system-ui, sans-serif;
    pointer-events: none;
    text-shadow: 0 1px 2px #000;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="help">Arrows / WASD fly &nbsp;·&nbsp; Shift / Ctrl throttle &nbsp;·&nbsp; Space brake &nbsp;·&nbsp; C cockpit &nbsp;·&nbsp; M sound &nbsp;·&nbsp; P pause &nbsp;·&nbsp; R restart</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
